<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SK Cafe | Coffee, Snacks & Cozy Moments</title>
<meta name="description" content="Visit SK Cafe for freshly brewed coffee, delicious snacks and a cozy café experience.">
<meta property="og:title" content="SK Cafe | Coffee, Snacks & Cozy Moments"><meta property="og:type" content="restaurant">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@400;500;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/lucide.min.js"></script>
<style>
:root{--dc:#2B1710;--cb:#4A2618;--cf:#6F432C;--ca:#B87945;--cr:#FFF4E5;--bg:#F3E1CC;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*:before,*:after{box-sizing:inherit}html{height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100%;font:400 16px/1.6 Poppins,system-ui,sans-serif;background:var(--cr);color:var(--dc)}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif;line-height:1.15;margin:0 0 .5em}h1{font-size:clamp(2.2rem,6vw,4rem)}h2{font-size:clamp(1.6rem,4vw,2.4rem)}
img{max-width:100%;display:block}a{color:inherit}:focus-visible{outline:3px solid var(--ca);outline-offset:2px}
.w{max-width:1120px;margin:auto;padding:0 20px}.sec{padding:56px 0}.dark{background:var(--cb);color:var(--cr)}.dark .mut{color:#e7cfb4}.mut{color:#6b4a38}
.btn{display:inline-flex;gap:8px;align-items:center;justify-content:center;border:0;border-radius:99px;padding:12px 24px;font:600 15px Poppins;cursor:pointer;background:var(--ca);color:#fff;text-decoration:none;transition:.25s}
.btn:hover{transform:translateY(-2px);background:var(--cf)}.btn.o{background:transparent;border:2px solid currentColor}.btn[disabled]{opacity:.45;pointer-events:none}.btn.s{padding:8px 16px;font-size:14px}
nav{position:fixed;inset:0 0 auto 0;z-index:50;padding-top:env(safe-area-inset-top,0px);transition:.35s;color:var(--cr)}nav.sc{background:rgba(43,23,16,.88);backdrop-filter:blur(10px)}
nav .w{display:flex;align-items:center;gap:18px;height:68px}.logo{font:700 22px 'Playfair Display';text-decoration:none;display:flex;gap:8px;align-items:center;margin-right:auto}
.links{display:flex;gap:6px}.links a{padding:8px 12px;border-radius:99px;text-decoration:none;font-size:15px}.links a:hover,.links a.on{background:rgba(255,244,229,.18)}
.ham{display:none;background:none;border:0;color:inherit;cursor:pointer}
@keyframes bump{50%{transform:scale(1.25)}}.bump{animation:bump .4s}
.card{background:#fff;border-radius:22px;box-shadow:0 8px 28px rgba(74,38,24,.12);overflow:hidden}
.grid{display:grid;gap:22px;grid-template-columns:repeat(auto-fill,minmax(235px,1fr))}
.hero{min-height:100vh;display:grid;align-items:center;color:var(--cr);background:linear-gradient(90deg,rgba(43,23,16,.92),rgba(43,23,16,.45)),var(--bgimg) center/cover;padding:110px 0 60px;position:relative;overflow:hidden}
.hero p{max-width:520px;font-size:18px}.row{display:flex;gap:12px;flex-wrap:wrap}
.steam{position:absolute;right:18%;bottom:20%;display:flex;gap:14px}.steam i{width:10px;height:70px;border-radius:99px;background:linear-gradient(#fff6,transparent);animation:st 3s infinite ease-in;filter:blur(4px)}.steam i:nth-child(2){animation-delay:.8s}.steam i:nth-child(3){animation-delay:1.6s}
@keyframes st{0%{transform:translateY(40px) scaleX(1);opacity:0}40%{opacity:.8}100%{transform:translateY(-70px) scaleX(2);opacity:0}}
.ft{padding:26px;text-align:center}.ft i,.ft svg{width:34px;height:34px;color:var(--ca)}
.ph{background:linear-gradient(135deg,var(--bg),#e6c7a3);display:grid;place-items:center;color:var(--cf)}.ph svg{width:56px;height:56px}
.mc img,.mc .ph{height:170px;width:100%;object-fit:cover}.mc img{transition:.5s}.mc:hover img{transform:scale(1.07)}.mc .b{padding:16px}.mc h3{font-size:19px;margin:0}
.mc .d{font-size:13.5px;color:#6b4a38;margin:4px 0 12px;min-height:42px}.pr{font-weight:600;font-size:18px}.tag{font-size:12px;background:var(--bg);border-radius:99px;padding:2px 10px}
.mc{animation:pop .4s both}@keyframes pop{from{opacity:0;transform:scale(.94)}}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.chip{border:2px solid var(--ca);background:none;border-radius:99px;padding:7px 16px;cursor:pointer;font:500 14px Poppins;color:var(--cb)}.chip.on{background:var(--cb);border-color:var(--cb);color:#fff}
input,select,textarea{width:100%;padding:12px 14px;border:2px solid #e2c9ad;border-radius:14px;font:inherit;background:#fff}input:focus,select:focus,textarea:focus{border-color:var(--ca);outline:0}
label{font-weight:500;font-size:14px;display:block;margin:12px 0 4px}.err{color:#b3261e;font-size:13px;min-height:18px}
.pg{padding-top:100px;min-height:70vh}.ph1{background:var(--cb);color:var(--cr);padding:118px 0 44px}
.fly{position:fixed;z-index:99;width:54px;height:54px;border-radius:50%;object-fit:cover;pointer-events:none;box-shadow:0 6px 18px #0005}
.bean{position:fixed;z-index:99;width:8px;height:12px;background:var(--cf);border-radius:50%;pointer-events:none}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,120px);background:var(--dc);color:var(--cr);padding:12px 22px;border-radius:99px;z-index:99;transition:.4s;max-width:92vw}#toast.on{transform:translate(-50%,0)}
.ci{display:grid;grid-template-columns:80px 1fr auto;gap:14px;align-items:center;padding:14px;border-bottom:1px solid #eee}.ci img,.ci .ph{width:80px;height:80px;border-radius:14px;object-fit:cover}
.q{display:flex;align-items:center;gap:10px}.q button{width:32px;height:32px;border-radius:50%;border:2px solid var(--ca);background:none;cursor:pointer;font-size:18px}
.two{display:grid;gap:28px;grid-template-columns:1fr 1fr}.tot div{display:flex;justify-content:space-between;padding:4px 0}
.gal{columns:3 220px;gap:16px}.gal img{margin-bottom:16px;border-radius:18px;cursor:zoom-in;transition:.4s;width:100%}.gal img:hover{transform:scale(1.03);filter:brightness(1.08)}
#lb{position:fixed;inset:0;background:#000d;z-index:90;display:none;place-items:center;padding:20px;cursor:zoom-out}#lb.on{display:grid;animation:pop .3s}#lb img{max-height:88vh;border-radius:16px}
.vch{border:3px dashed var(--ca);border-radius:22px;padding:26px;background:#fff;text-align:center;animation:rev .8s both}@keyframes rev{from{opacity:0;transform:rotate(-6deg) scale(.6)}}
.code{font:600 28px monospace;letter-spacing:2px;color:var(--cf)}
.lg{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 20% 20%,#fff4e5,#f3e1cc 60%,#e6c7a3);position:relative;overflow:hidden}
.lg .fl{position:absolute;width:clamp(70px,13vw,150px);aspect-ratio:1;border-radius:50%;object-fit:cover;border:5px solid #fff;box-shadow:0 10px 26px #4a261833;animation:fl 6s ease-in-out infinite}
@keyframes fl{50%{transform:translateY(-16px) rotate(4deg)}}
.lc{position:relative;z-index:2;width:min(420px,100%);padding:34px;text-align:center}.qt{font-family:'Playfair Display';font-style:italic;color:var(--cf)}
.pm{display:flex;gap:8px;margin:10px 0}.pm button{flex:1;padding:10px;border:2px solid #e2c9ad;background:#fff;border-radius:12px;cursor:pointer;font:500 14px Poppins}.pm button.on{border-color:var(--ca);background:var(--bg)}
.ok{color:#1b7a3a;font-weight:600}footer{background:var(--dc);color:var(--cr);padding:44px 0 24px}footer a{text-decoration:none;display:block;padding:2px 0;opacity:.85}
.ld{text-align:center;padding:60px 0}.sp{width:44px;height:44px;border:5px solid var(--bg);border-top-color:var(--ca);border-radius:50%;margin:0 auto 12px;animation:r 1s linear infinite}@keyframes r{to{transform:rotate(360deg)}}
.fi{animation:fi .5s both}@keyframes fi{from{opacity:0;transform:translateY(14px)}}
@media(max-width:820px){.links{position:absolute;top:calc(68px + env(safe-area-inset-top,0px));left:0;right:0;flex-direction:column;background:var(--dc);padding:0 20px;max-height:0;overflow:hidden;transition:.35s}.links.open{max-height:420px;padding:12px 20px}.ham{display:block}.two{grid-template-columns:1fr}.hide-m{display:none}.fl.x{display:none}.steam{display:none}.ci{grid-template-columns:64px 1fr}.ci>:last-child{grid-column:1/-1}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:root[data-theme=dark]{}
</style></head><body>

 <div><div class="card" style="padding:24px"><h3>Table Booking Advance: ₹100</h3><p class="mut">The advance is mandatory to confirm your table. Demo payment only; no real money is charged.</p><div class="pm" role="group" aria-label="Payment method">${['UPI','Card','Net Banking'].map(x=>`<button type="button" data-pm="${x}" class="${x==pm?'on':''}">${x}</button>`).join('')}</div><div id="pi"></div><button class="btn" id="pb" style="width:100%;margin-top:10px"><i data-lucide="credit-card" width="16"></i>Pay ₹100 Advance</button><div id="ps" role="status"></div></div>

 <div>${bk.total>500?`<div class="vch"><h2>🎁 Special Gift Unlocked!</h2><p>Your booking total is ${R(bk.total)}. You've unlocked a special SK Cafe Gift Voucher!</p><div class="code">${bk.code}</div><p><b>₹100 OFF</b> on your next visit.</p><div class="row" style="justify-content:center"><button class="btn s" id="vc">Copy Voucher</button><button class="btn s o" id="vd" style="color:var(--cb)">Save Voucher</button></div></div>`:`<div class="card" style="padding:28px;text-align:center"><h2>Thank you for booking with SK Cafe!</h2><p class="mut">We can't wait to host you.</p></div>`}<a class="btn" style="margin-top:16px" href="#/">Back to Home</a></div></section>`}};
const NAV=[['','Home'],['about','About'],['menu','Menu'],['gallery','Gallery'],['reviews','Reviews'],['contact','Contact']];
const TT={menu:'Menu',about:'About',cart:'Cart',book:'Book a Table',gallery:'Gallery',reviews:'Reviews',contact:'Contact',login:'Login',confirmation:'Confirmation'};
function route(){let r=location.hash.replace(/^#\/?/,'');if(!P[r]&&r!=='')r='';const k=r||'home';if(!user&&k!='login'){location.hash='#/login';return}
 $('#app').innerHTML=P[k]();$('#app').firstElementChild.classList.add('fi');document.title=(TT[k]?TT[k]+' | ':'')+'SK Cafe | Coffee, Snacks & Cozy Moments';
 const lg=k=='login';$('#nav').style.display=$('#ft').style.display=lg?'none':'';$('#lk').innerHTML=NAV.map(n=>`<a href="#/${n[0]}" class="${n[0]==r?'on':''}">${n[1]}</a>`).join('')+'<a class="hide-d" href="#/book">Book a Table</a>';
 $('#ft').innerHTML=`<div class="w two"><div><h3>SK CAFE</h3><p>Good Coffee. Great Snacks. Happy Moments.</p><div class="row"><i data-lucide="instagram"></i><i data-lucide="facebook"></i><i data-lucide="message-circle"></i></div></div><div><div style="columns:2">${NAV.map(n=>`<a href="#/${n[0]}">${n[1]}</a>`).join('')}<a href="#/book">Book a Table</a></div><p style="font-size:14px">+91 98765 43210 · hello@skcafe.example · Coimbatore, Tamil Nadu</p></div></div><p class="w" style="opacity:.7;font-size:13px">© 2026 SK Cafe. All Rights Reserved.</p>`;
 $('#lk').classList.remove('open');scrollTo(0,0);scr();bind(k);lucide&&lucide.createIcons()}
const scr=()=>$('#nav').classList.toggle('sc',scrollY>40||!(location.hash==''||location.hash=='#/'));
function menuGrid(){const l=M.filter(m=>(cat=='All'||m.category==cat)&&(m.name+m.description+m.category).toLowerCase().includes(q.toLowerCase()));$('#mg').innerHTML=l.map(card).join('')||'<p>No matches yet. Try another search.</p>';lucide.createIcons()}
function bind(k){
 if(k=='login'){let reg=0;$('#ca').onclick=()=>{reg=!reg;$('#nm').style.display=reg?'block':'none';$('#lb1').textContent=reg?'Create & Enter':'Login'};$('#fp').onclick=e=>{e.preventDefault();toast('A reset link would be emailed (demo).')};
  $('#lf').onsubmit=e=>{e.preventDefault();const em=$('#em').value.trim(),pw=$('#pw').value;$('#e_em').textContent=em?'':'Please enter your email or username.';$('#e_pw').textContent=pw.length>=4?'':'Password needs at least 4 characters.';if(!em||pw.length<4)return;user=em;location.hash='#/';toast('Welcome to SK Cafe!')}}
 if(k=='menu'){setTimeout(menuGrid,500);$('#sq').oninput=e=>{q=e.target.value;menuGrid()};$$('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;$$('[data-cat]').forEach(x=>x.classList.toggle('on',x==b));menuGrid()})}
 if(k=='gallery')$$('[data-gc]').forEach(b=>b.onclick=()=>{gc=b.dataset.gc;route()});
 if(k=='cart'){$$('[data-q]').forEach(b=>b.onclick=()=>{const i=b.dataset.q;cart[i]=Math.max(1,cart[i]+ +b.dataset.d);save();upd2()});$$('[data-rm]').forEach(b=>b.onclick=()=>{delete cart[b.dataset.rm];save();upd2()})}
 if(k=='book'){pay=false;const pi=()=>$('#pi').innerHTML=pm=='UPI'?'<label for="up">UPI ID</label><input id="up" placeholder="name@upi">':pm=='Card'?'<label for="cn">Card number</label><input id="cn" inputmode="numeric" placeholder="4111 1111 1111 1111"><div class="row"><input aria-label="Expiry" placeholder="MM/YY" style="flex:1"><input aria-label="CVV" placeholder="CVV" style="flex:1"></div>':'<label for="bn">Bank</label><select id="bn"><option>State Bank of India</option><option>HDFC Bank</option><option>ICICI Bank</option></select>';pi();
  $$('[data-pm]').forEach(b=>b.onclick=()=>{if(pay)return;pm=b.dataset.pm;$$('[data-pm]').forEach(x=>x.classList.toggle('on',x==b));pi()});
  $('#dt').min=new Date().toISOString().slice(0,10);
  const valid=()=>{let ok=1;$$('#bf [required]').forEach(i=>{const v=i.checkValidity()&&i.value.trim();$('#e_'+i.id).textContent=v?'':'Please complete this field correctly.';if(!v)ok=0});return ok};
  $('#pb').onclick=()=>{const f=$('#pi input');if(f&&!f.value.trim()&&pm!='Net Banking'){$('#ps').innerHTML='<p class="err">Payment could not be completed. Please enter your payment details.</p>';return}
   $('#ps').innerHTML=loading('Processing payment...');setTimeout(()=>{pay=true;$('#ps').innerHTML='<p class="ok">₹100 Advance Paid Successfully ✓</p>';$('#pb').disabled=true;$('#cf').disabled=false},1300)};
  $('#cf').onclick=()=>{if(!valid()){$('#ce').textContent='Please complete all required fields.';return}if(!pay){$('#ce').textContent='Please pay the ₹100 advance first.';return}
   const f=window._f();$('#app').innerHTML=loading('Confirming your table...');const t=tot(),c='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';setTimeout(()=>{bk={id:'SKC-'+Date.now().toString().slice(-6),name:f.name,date:f.date,time:f.time,guests:f.guests,total:t,code:'SKCAFE100-'+[0,0,0,0].map(()=>c[Math.random()*c.length|0]).join('')};cart={};save();upd();location.hash='#/confirmation'},900)};
  $('#bf').addEventListener('input',()=>$('#ce').textContent='');window._f=()=>({name:$('#fn').value,date:$('#dt').value,time:$('#tm').value,guests:$('#gs').value})}
 if(k=='confirmation'&&bk){$('#vc')&&($('#vc').onclick=()=>{navigator.clipboard?.writeText(bk.code).then(()=>toast('Voucher copied!'),()=>toast(bk.code))});$('#vd')&&($('#vd').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([`SK Cafe Gift Voucher\n${bk.code}\n₹100 OFF on your next visit`]));a.download=bk.code+'.txt';a.click()})}
 $$('[data-lb]').forEach(i=>{const o=()=>{$('#lb img').src=i.src;$('#lb img').alt=i.alt;$('#lb').classList.add('on')};i.onclick=o;i.onkeydown=e=>e.key=='Enter'&&o()})}
function upd2(){const y=scrollY;route();scrollTo(0,y);upd()}
